<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="rgb(131, 35, 46)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cochabamba Móvil - Login</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/mobile.css">
</head>
<body data-public="true">
    <div class="login-container">
        <img src="img/logos/logoX.webp" alt="Cochabamba" class="login-logo" onerror="this.src='img/logos/logoX.png'">
        <div class="login-card">
            <h1 class="login-title">Cochabamba Móvil</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-input" id="email" placeholder="tu@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" class="form-input" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <div id="loginError" class="form-error" style="display: none;"></div>
                <button type="submit" class="btn btn-primary btn-block btn-lg mt-2" id="loginBtn">Ingresar</button>
            </form>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
